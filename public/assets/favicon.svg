<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="globeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0A58CA" />
      <stop offset="100%" stop-color="#002D62" />
    </linearGradient>
    <linearGradient id="chromeZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="ringSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Globe Base -->
  <circle cx="32" cy="30" r="22" fill="url(#globeBlue)" />
  <circle cx="32" cy="30" r="21.5" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />

  <!-- Abstract Continental Map Lines -->
  <path d="M22 20 C24 16, 28 17, 30 15 C33 13, 37 14, 40 18 C38 22, 35 24, 32 25 Z" fill="#FFFFFF" opacity="0.85" />
  <path d="M25 28 C28 29, 29 34, 27 38 C25 42, 23 44, 24 46 C21 44, 18 38, 20 33 Z" fill="#FFFFFF" opacity="0.85" />

  <!-- 3D Metallic Chrome Z -->
  <polygon points="20,17 44,17 43,23 30,35 44,35 44,42 18,42 19,36 33,24 20,24" fill="url(#chromeZ)" filter="url(#glow)" />

  <!-- Deep Blue Accent Triangle under Z -->
  <polygon points="34,36 44,36 44,42" fill="#002D62" />

  <!-- Planetary Orbital Ring -->
  <path d="M12 40 C14 47, 44 48, 52 32 C54 28, 52 24, 48 23 C52 27, 46 39, 22 41 C17 41, 13 39, 12 40 Z" fill="url(#ringSilver)" />

  <!-- 4-Pointed Compass Star -->
  <path d="M49 14 L50.5 17 L53.5 18.5 L50.5 20 L49 23 L47.5 20 L44.5 18.5 L47.5 17 Z" fill="#38BDF8" />
  <circle cx="49" cy="18.5" r="1" fill="#FFFFFF" />
</svg>